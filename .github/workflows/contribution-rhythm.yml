name: Update contribution snake

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-rhythm.yml

permissions:
  contents: read

concurrency:
  group: contribution-rhythm
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/contribution-snake-light.svg?color_snake=#b78b48&color_dots=#e5e9e1,#c1d0b1,#99b586,#6f925e,#426337
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#e3b778&color_dots=#232c30,#394e45,#58755c,#81966d,#b8c99a

      - name: Verify animated SVG output
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for theme in ('light', 'dark'):
              path = Path(f'assets/contribution-snake-{theme}.svg')
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              content = path.read_text()
              assert '@keyframes' in content and 'animation:' in content, path
              print(f'Validated {path} ({path.stat().st_size} bytes)')
          PY

      - name: Upload validated animations
        uses: actions/upload-artifact@v4
        with:
          name: contribution-snakes
          path: assets/contribution-snake-*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download validated animations
        uses: actions/download-artifact@v4
        with:
          name: contribution-snakes
          path: assets
      - name: Commit updated animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake-light.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No visual changes."
            exit 0
          fi
          git commit -m "chore: refresh contribution snake animations"
          git pull --rebase origin main
          git push origin HEAD:main
