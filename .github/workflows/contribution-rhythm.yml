name: Update contribution rhythm

on:
  schedule:
    - cron: "25 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-rhythm
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Render real GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_contribution_rhythm.py --user takagibit18

      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-rhythm.png
          if git diff --cached --quiet; then
            echo "No visual changes."
            exit 0
          fi
          git commit -m "chore: refresh contribution rhythm"
          git push
